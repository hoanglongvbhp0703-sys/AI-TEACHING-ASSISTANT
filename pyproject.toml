[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gos-academy-backend"
version = "0.1.0"
description = "GOS Academy local MVP API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "SQLAlchemy==2.0.57",
  "pydantic-settings==2.16.2", "python-multipart==0.0.33",
  "pypdf==7.0.0", "python-docx==1.2.0", "openpyxl==3.1.5",
  "qdrant-client==1.20.0", "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "sentence-transformers==5.7.0", "pyvi==0.1.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db.migrations.versions" = ["*.sql"]
"app" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
